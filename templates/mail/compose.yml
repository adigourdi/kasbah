# The shared mail stack — one instance per VPS, installed at <apps>/mail/compose.yml
# by `kasbah server init --with-mail`. Ported from the original project's mail/compose.yml
# and generalised to serve more than one domain (docs/mail.md).
#
# Unlike the Traefik stack this one *does* carry a `.env`: compose interpolates
# the volume paths and docker-mailserver reads DOMAIN and MAIL_HOSTNAME out of
# its own environment, so these are variables rather than baked bytes. The
# kasbah-owned half of that file is derived from `kasbah.yml` beside it and
# rewritten on every run; the relay block below it belongs to the operator and
# is copied through untouched.
#
# **Routing is deliberately not here.** The original project expressed every route as a
# Traefik label; kasbah does not wire the docker provider in at all, so both
# routers live in the kasbah-owned file fragment
# <apps>/traefik/dynamic/_mail.yml. That is also what breaks the boot-order
# deadlock: DMS will not start without a certificate for ${MAIL_HOSTNAME},
# Traefik only requests one for a hostname some router claims, and a router
# carried by a container that cannot start is a certificate that is never
# issued (docs/mail.md → TLS flow).
#
# Run by hand as: docker compose -p mail up -d
# The `-p` is not optional — `name:` below is the weakest source of the project
# name, and COMPOSE_PROJECT_NAME in the environment outranks it.
name: mail

services:
  # Postfix + Dovecot + Rspamd + Fail2ban in one image. Rspamd replaces
  # OpenDKIM, OpenDMARC, policyd-spf, Amavis and SpamAssassin, all of which are
  # switched off below rather than left to the image's defaults.
  #
  # The service is named for its container on purpose. Compose registers a
  # service's *name* as a DNS alias on every network it joins, so a service
  # called `dms` would claim the bare `dms` alias on the shared kasbah-net —
  # the collision `kasbah check`'s C09 warns every project about
  # (docs/traefik.md → Network).
  mail-dms:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    container_name: mail-dms
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    stop_grace_period: 1m
    # Bound directly on the host: Traefik is an HTTP proxy and is not in the
    # mail data path. server-setup.md's prerequisites table names :80 and :443
    # and not these — a port already held here surfaces as compose failing.
    ports:
      - "25:25"     # SMTP, inbound from other servers
      - "465:465"   # SMTPS, implicit TLS submission
      - "587:587"   # Submission, STARTTLS
      - "993:993"   # IMAPS
    volumes:
      - ${DATA_PATH}/mail/dms/mail-data:/var/mail
      - ${DATA_PATH}/mail/dms/mail-state:/var/mail-state
      - ${DATA_PATH}/mail/dms/mail-logs:/var/log/mail
      - ${DATA_PATH}/mail/dms/config:/tmp/docker-mailserver
      # A read-only *file* (init touches it first; DMS writes /etc/letsencrypt/live/
      # itself, so not the directory). It follows one inode: Traefik and init's
      # ACME reset only ever rewrite it in place.
      - ${DATA_PATH}/traefik/letsencrypt/acme.json:/etc/letsencrypt/acme.json:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      OVERRIDE_HOSTNAME: ${MAIL_HOSTNAME}
      POSTMASTER_ADDRESS: postmaster@${DOMAIN}

      # DMS v15+ reads Traefik's acme.json natively — no certs-dumper sidecar,
      # and it re-reads the file when Traefik renews. It also refuses to start
      # without a certificate for SSL_DOMAIN, which is why _mail.yml claims that
      # hostname from a file fragment rather than from this container.
      SSL_TYPE: letsencrypt
      SSL_DOMAIN: ${MAIL_HOSTNAME}

      # No network is trusted, kasbah-net included: an app on the shared network
      # authenticates on 587 like any other client (docs/mail.md → SMTP access).
      PERMIT_DOCKER: none
      POSTFIX_INET_PROTOCOLS: ipv4

      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0

      ENABLE_FAIL2BAN: 1
      SPOOF_PROTECTION: 1

      # Operator-owned, and empty by default: direct delivery on port 25. See
      # the relay block in .env — these three are the only values in this file
      # kasbah never derives.
      DEFAULT_RELAY_HOST: ${DEFAULT_RELAY_HOST:-}
      RELAY_USER: ${RELAY_USER:-}
      RELAY_PASSWORD: ${RELAY_PASSWORD:-}
    cap_add:
      - NET_ADMIN          # Fail2ban manages iptables with it
    networks:
      - kasbah-net
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --ipv4 --tcp | grep --silent ':smtp' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # SnappyMail boots in about ten seconds whatever the certificate store holds,
  # which is why the original project hung the cert-trigger router on it. kasbah does not
  # need that trick — the fragment is a file — but the property still matters:
  # webmail is up long before DMS settles.
  mail-snappymail:
    image: djmaze/snappymail:v2.38.2
    container_name: mail-snappymail
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/mail/snappymail:/var/lib/snappymail
    networks:
      - kasbah-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Deliberately no `cpus:` / `mem_limit:`, for the reason templates/traefik/compose.yml
# gives: those ceilings exist so one *project* cannot lock out Traefik and SSH,
# and `kasbah check`'s R01-R03 govern project compose files rather than
# kasbah-owned stacks. A throttled mail server drops mail silently.

# Created by the Traefik stack, which is why mail requires Traefik to be up
# first (docs/server-setup.md → With mail).
networks:
  kasbah-net:
    external: true

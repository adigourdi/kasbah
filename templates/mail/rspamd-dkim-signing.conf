# Rspamd DKIM signing — dual signing, Ed25519 primary with an RSA fallback.
#
# Rendered whole by kasbah (`server init --with-mail`, `server add-mail-domain`)
# into
#   <data>/mail/dms/config/rspamd/override.d/dkim_signing.conf
# from the mail registry (<apps>/mail/kasbah.yml) and the keys in
#   <data>/mail/dms/config/rspamd/dkim/
# one block per registry domain that has a key, one selector per key. The
# first line is the sha256 of the rest: a render replaces a file whose digest
# still matches without a copy, and keeps any other (a hand edit) beside this
# one as dkim_signing.conf.kasbah-prev, which Rspamd never loads.
#
# Ed25519 produces a tiny DNS record and is the stronger algorithm; RSA is kept
# for receivers that do not verify Ed25519 yet.
#
# kasbah generates each domain's two keys with docker-mailserver's own rspamadm
# and never replaces one; a missing public file is derived from its private
# key. Publish the two TXT records from
#   <data>/mail/dms/config/rspamd/dkim/*-<domain>.public.dns.txt
# as mail._domainkey.<domain> (RSA) and ed._domainkey.<domain> (Ed25519).
#
# **Back up <data>/mail/dms/config/rspamd/dkim/.** A regenerated key is a
# different key, and every receiver holding the old one fails verification until
# its cache expires.
# Docs: https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;
sign_local = false;

try_fallback = true;
use_domain = "header";
use_redis = false;
use_esld = true;

domain {
__MAIL_DKIM_DOMAINS__}

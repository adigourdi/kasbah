# Rspamd DKIM signing — dual signing, Ed25519 primary with an RSA fallback.
#
# Seeded by `kasbah server init --with-mail` into
#   <data>/mail/dms/config/rspamd/override.d/dkim_signing.conf
# **before docker-mailserver first starts**, and never overwritten afterwards.
# The order is the whole point: because the file already exists, DMS's
# `setup config dkim` helper generates key files without writing its own
# single-selector default over this one.
#
# Ed25519 produces a tiny DNS record and is the stronger algorithm; RSA is kept
# for receivers that do not verify Ed25519 yet.
#
# Generate both keys after the stack is up, on the VPS:
#   docker exec mail-dms setup config dkim keytype rsa     selector mail domain __MAIL_PRIMARY_DOMAIN__
#   docker exec mail-dms setup config dkim keytype ed25519 selector ed   domain __MAIL_PRIMARY_DOMAIN__
#
# then publish the two TXT records from
#   <data>/mail/dms/config/rspamd/dkim/*.public.dns.txt
# as mail._domainkey.__MAIL_PRIMARY_DOMAIN__ (RSA) and
#    ed._domainkey.__MAIL_PRIMARY_DOMAIN__ (Ed25519).
# Rspamd reloads on its own; no restart is needed.
#
# **Back up <data>/mail/dms/config/rspamd/dkim/.** A regenerated key is a
# different key, and every receiver holding the old one fails verification until
# its cache expires.
#
# A domain added to the stack later needs its own block below; kasbah writes
# this file once, for the primary domain.
# Docs: https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;
sign_local = false;

try_fallback = true;
use_domain = "header";
use_redis = false;
use_esld = true;

domain {
    __MAIL_PRIMARY_DOMAIN__ {
        selectors [
            {
                path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-__MAIL_PRIMARY_DOMAIN__.private.txt";
                selector = "mail";
            },
            {
                path = "/tmp/docker-mailserver/rspamd/dkim/ed25519-ed-__MAIL_PRIMARY_DOMAIN__.private.txt";
                selector = "ed";
            }
        ]
    }
}

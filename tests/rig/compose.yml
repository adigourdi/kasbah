# Project name pinned here so every `docker compose` call lands on the rig and
# only the rig, whatever directory it is run from — this repo is developed on
# workstations with unrelated containers running.
name: kasbah-rig

services:
  rig:
    build:
      context: .
      args:
        DOCKER_APT_VERSION: ${KASBAH_RIG_DOCKER_VERSION:-}
    image: kasbah-rig
    container_name: kasbah-rig
    # Nested dockerd needs full kernel access (cgroups, netlink, mounts).
    privileged: true
    init: true
    environment:
      # Passed in, not mounted: Docker turns a missing bind-mount source into a
      # root-owned directory on the host, which an env var cannot do. Left
      # defaulting to empty rather than `:?` so that `down` and `ps` still work
      # when no key is exported; the entrypoint is what rejects an empty value.
      RIG_AUTHORIZED_KEY: ${KASBAH_RIG_PUBKEY:-}
      # How long the entrypoint waits for the nested dockerd to answer. Empty
      # means "the entrypoint's own default" — passing it unconditionally is what
      # makes the knob exist at all, since the container sees only what is
      # declared here. Inside the container the prefix is RIG_, not KASBAH_RIG_:
      # the latter names the host-side override.
      RIG_DOCKERD_TIMEOUT: ${KASBAH_RIG_DOCKERD_TIMEOUT:-}
    ports:
      # Loopback by default: this is a privileged container whose SSH user has
      # passwordless sudo, so LAN exposure would be root-equivalent on the host.
      # Every consumer is local; widening the bind stays possible but deliberate.
      # The port defaults sit above the usual dev-server range because 8080/8443
      # are routinely taken on developer machines.
      - "${KASBAH_RIG_BIND:-127.0.0.1}:${KASBAH_RIG_SSH_PORT:-5022}:22"
      - "${KASBAH_RIG_BIND:-127.0.0.1}:${KASBAH_RIG_HTTP_PORT:-5080}:80"
      - "${KASBAH_RIG_BIND:-127.0.0.1}:${KASBAH_RIG_HTTPS_PORT:-5043}:443"
    volumes:
      # Mandatory, not an optimisation: on an overlayfs-backed container
      # layer the nested dockerd degrades to vfs or refuses to start.
      - docker-data:/var/lib/docker
    healthcheck:
      # Asserts three conditions, each of which has been observed true while
      # the others were false: the nested daemon answers *as stevedore* (the
      # "docker without sudo" prerequisite row), sshd accepts on :22, and an
      # authorized key is installed. Not proven: that the installed key is the
      # *right* one — a mismatched key still reads as healthy.
      # /dev/tcp is a bash builtin, hence CMD with bash rather than CMD-SHELL.
      test:
        - CMD
        - bash
        - -c
        - 'su -s /bin/bash stevedore -c "docker info" >/dev/null 2>&1 && [ -s /home/stevedore/.ssh/authorized_keys ] && exec 3<>/dev/tcp/127.0.0.1/22'
      interval: 10s
      timeout: 5s
      retries: 3
      # A healthy rig arrives in about two seconds, so a long grace period only
      # delays the report of a broken one.
      start_period: 30s

  # The backup target Phase 8 tests against, as two servers over one store.
  # rest-server's `--append-only` is a process-wide flag, not a per-user
  # permission (checked against `rest-server --help`, 0.14.0), so one endpoint
  # cannot hold both credential sets: `backup-store` is what a VPS is given and
  # `backup-store-admin` is what the operator prunes with. Separate htpasswd
  # files in the shared store keep each user unknown to the other endpoint.
  backup-store:
    image: &rest_server restic/rest-server:0.14.0
    container_name: kasbah-rig-backup-store
    environment: &rest_env
      RIG_BACKUP_USER: kasbah-vps
      RIG_BACKUP_PASSWORD: append-only-secret
      PASSWORD_FILE: /data/.htpasswd-vps
      OPTIONS: --append-only
    # The stock entrypoint only warns when no user exists and serves anyway.
    # Creating the user here instead makes a credential-less server a container
    # that never starts, which the readiness probe reports.
    entrypoint: &rest_entrypoint
      - /bin/sh
      - -c
      - 'umask 027 && : > "$$PASSWORD_FILE" && create_user "$$RIG_BACKUP_USER" "$$RIG_BACKUP_PASSWORD" && exec /entrypoint.sh'
    volumes:
      - backup-store:/data
    networks:
      default:
        ipv4_address: 10.77.29.10

  backup-store-admin:
    image: *rest_server
    container_name: kasbah-rig-backup-store-admin
    environment:
      <<: *rest_env
      RIG_BACKUP_USER: kasbah-ops
      RIG_BACKUP_PASSWORD: full-access-secret
      PASSWORD_FILE: /data/.htpasswd-ops
      OPTIONS: ""
    entrypoint: *rest_entrypoint
    volumes:
      - backup-store:/data
    networks:
      default:
        ipv4_address: 10.77.29.11

networks:
  # Pinned so the backup endpoints have addresses a *nested* container can be
  # handed. Nested dockerd copies the rig's /etc/resolv.conf, sees the embedded
  # DNS at 127.0.0.11, and substitutes 8.8.8.8 — so service names resolve from
  # the rig's own shell and not from the restic container two namespaces down
  # (measured 2026-08-26). Routing works either way, so the repo URL carries a
  # literal IP and no DNS.
  #
  # 10.77.29.0/24 is outside the 172.16.0.0/12 Docker draws /16 blocks from
  # when DefaultAddressPools is unset, which it is here. A subnet inside that
  # range would be claimable by any unrelated project started while the rig is
  # down, and every integration suite would then be blocked on a "Pool
  # overlaps" failure until someone hand-edited this file.
  default:
    ipam:
      config:
        - subnet: 10.77.29.0/24

volumes:
  docker-data:
  # Lives on the workstation's Docker, deliberately out of the rig's reach:
  # rig_clean sweeps every volume the *nested* daemon knows, so a snapshot store
  # here is what makes "restore onto a fresh rig" a thing a suite can run.
  backup-store:

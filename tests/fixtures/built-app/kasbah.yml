# The ship fixture: two images built from the Dockerfiles beside this file plus
# one stock image, small enough to reason about and real enough to route.
# tests/integration/ship_test.sh copies this directory somewhere writable,
# gives it a git repo with a v-tag, and runs `kasbah build-push` from the copy.
#
# The health:, hooks: and backup: blocks below are what makes this the deploy
# fixture as well as the ship one: `kasbah deploy` pre-renders them into the
# copy of templates/remote-deploy.sh it installs on the server, and
# tests/integration/deploy_ship_test.sh reads the breadcrumbs they leave.
schema: 1
kasbah_version: 0.1.0

name: built-app
domain: built-app.test

# traefik-dynamic.yml is deliberately absent from this list — kasbah ships it
# out of band to <apps>/traefik/dynamic/built-app.yml
# (docs/project-manifest.md). The Dockerfiles are absent too: images are built
# on the workstation and travel as a tarball, never as a build on the server.
sync:
  - compose.prod.yml -> compose.yml
  - .env.prod.example
  - state/

# What deploy blocks on after `compose up -d`, before the post-deploy hooks.
# The healthcheck itself lives in the Dockerfile, so it travels with the image.
health:
  container: built-app-web
  timeout: 60s

# Each entry is "<container_name> <command…>", run as
# `docker exec -e VERSION -e PREV_VERSION -e DEPLOY_BACKUP <container>
#  sh -c '<command…>'` — no -t, and no -T either, which is `docker compose
# exec`'s flag and not a `docker exec` one at all. The redirection therefore
# happens inside the container, into the bind mount compose declares — which is
# how a suite reads back that the hooks ran, in what order, and with which
# variables set.
hooks:
  pre-deploy:
    - 'built-app-web echo "pre-deploy version=$VERSION prev=$PREV_VERSION backup=$DEPLOY_BACKUP" >> /var/kasbah/breadcrumbs.log'
  post-deploy:
    - 'built-app-web echo "post-deploy version=$VERSION prev=$PREV_VERSION backup=$DEPLOY_BACKUP" >> /var/kasbah/breadcrumbs.log'
  # The other pair, which only `kasbah rollback` runs. Both pairs are rendered
  # into the shipped script on every deploy and rollback alike — the mode picks
  # one — so tests/integration/rollback_test.sh reads these breadcrumbs back out
  # of the same bind mount, and $PREV_VERSION is the version being left behind.
  pre-rollback:
    - 'built-app-web echo "pre-rollback version=$VERSION prev=$PREV_VERSION backup=$DEPLOY_BACKUP" >> /var/kasbah/breadcrumbs.log'
  post-rollback:
    - 'built-app-web echo "post-rollback version=$VERSION prev=$PREV_VERSION backup=$DEPLOY_BACKUP" >> /var/kasbah/breadcrumbs.log'

# `check` runs in the VPS host shell with cwd at the project directory, and its
# exit status decides whether a backup is taken at all; `command` runs through
# `sh -c` inside `container`, with its stdout piped through `pipe`. The payload
# is a fixed string so a suite can assert on the decompressed file rather than
# on the fact that some file appeared.
backup:
  container: built-app-web
  check: test -f ./compose.yml
  command: echo kasbah-built-app-backup-payload
  extension: txt.gz
  pipe: gzip
  retain: 3

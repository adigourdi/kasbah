# The ship fixture: two images built from the Dockerfiles beside this file plus
# one stock image, small enough to reason about and real enough to route.
# tests/integration/ship_test.sh copies this directory somewhere writable,
# gives it a git repo with a v-tag, and runs `kasbah build-push` from the copy.
#
# The health:, hooks: and backup: blocks below are what makes this the deploy
# fixture as well as the ship one: `kasbah deploy` sends them to the server's
# engine, and tests/integration/deploy_ship_test.sh reads the breadcrumbs they
# leave.
schema: 1
kasbah_version: 0.1.0

name: built-app
domain: built-app.test

# traefik-dynamic.yml is deliberately absent from this list — kasbah ships it
# out of band to <apps>/traefik/dynamic/built-app.yml
# (docs/project-manifest.md). The Dockerfiles are absent too: images are built
# on the workstation and travel as a tarball, never as a build on the server.
sync:
  - compose.prod.yml -> compose.yml
  - .env.prod.example
  - state/

# What deploy blocks on after `compose up -d`, before the post-deploy hooks.
# The healthcheck itself lives in the Dockerfile, so it travels with the image.
health:
  container: built-app-web
  timeout: 60s

# Each entry is one line of shell, run as `sh -c` on the server in
# <apps>/built-app/, with KASBAH_VERSION, KASBAH_PREV_VERSION and KASBAH_PROJECT
# set — so `state/breadcrumbs.log` is the file the web container sees at
# /var/kasbah, and a suite reads back that the hooks ran, in what order, and
# with which variables. The pre-deploy hook also writes to stdout, which kasbah
# must keep off the report channel; the post-deploy one reaches the new
# container by service name through `docker compose exec -T`.
hooks:
  pre-deploy:
    - 'echo "pre-deploy version=$KASBAH_VERSION prev=$KASBAH_PREV_VERSION project=$KASBAH_PROJECT cwd=$PWD" >> state/breadcrumbs.log; echo version=9.9.9-from-the-hook'
  post-deploy:
    - 'docker compose exec -T built-app-web true && echo "post-deploy version=$KASBAH_VERSION prev=$KASBAH_PREV_VERSION project=$KASBAH_PROJECT" >> state/breadcrumbs.log'
  # The other pair, which only `kasbah rollback` runs, read back by
  # tests/integration/rollback_test.sh from the same file; $KASBAH_PREV_VERSION
  # is the version being left behind.
  pre-rollback:
    - 'echo "pre-rollback version=$KASBAH_VERSION prev=$KASBAH_PREV_VERSION project=$KASBAH_PROJECT" >> state/breadcrumbs.log'
  post-rollback:
    - 'echo "post-rollback version=$KASBAH_VERSION prev=$KASBAH_PREV_VERSION project=$KASBAH_PROJECT" >> state/breadcrumbs.log'

# `check` runs in the VPS host shell with cwd at the project directory, and its
# exit status decides whether a backup is taken at all; `command` runs through
# `sh -c` inside `container`, with its stdout piped through `pipe`. The payload
# is a fixed string so a suite can assert on the decompressed file rather than
# on the fact that some file appeared.
backup:
  container: built-app-web
  check: test -f ./compose.yml
  command: echo kasbah-built-app-backup-payload
  extension: txt.gz
  pipe: gzip
  retain: 3

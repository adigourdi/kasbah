http:
  routers:
    dash-http:
      rule: "Host(`traefik.rig.test`)"
      entryPoints: [web]
      middlewares: ["http-to-https@file"]
      service: noop@internal
    dash:
      rule: "Host(`traefik.rig.test`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: dash
  services:
    dash:
      loadBalancer:
        servers:
          - url: "http://dash-web:80"

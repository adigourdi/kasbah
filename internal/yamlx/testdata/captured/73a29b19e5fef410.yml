services:
  # the scalar comes first, and its content is deeper than its own header —
  # which is why finding a block's first child never walks into one
  demo-mid:
    entrypoint: |
      set -e
      # inside the scalar, and therefore not a comment
    image: nginx:alpine
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  demo-web:
    image: nginx:alpine
    container_name: demo-web
    networks: [kasbah-net]
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: |
      set -e
      nginx -g 'daemon off;'
      # the trailing comment the author wrote
      # and a second one

  demo-keep:
    image: busybox
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: |+
      echo hi


networks:
  kasbah-net:
    external: true

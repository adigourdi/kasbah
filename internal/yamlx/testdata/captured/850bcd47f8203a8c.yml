# a comment above version, which stays: a header and a key comment cannot be
# told apart, and eating a file header would be worse than one stale line
version: "3.8"

services:
  demo-web:
    build:
      context: .
    image: "registry.example:5000/demo-web:1.4.2"   # pinned by hand # twice
    container_name: demo-web
    restart: unless-stopped
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    networks: [kasbah-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.25"
          memory: 64M

  demo-side:
    build:
      context: ./side
    image: registry.example:5000/demo-side
    restart: unless-stopped
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  demo-worker:
    image: busybox
    restart: unless-stopped
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          memory: 32M

networks:
  kasbah-net:
    external: true

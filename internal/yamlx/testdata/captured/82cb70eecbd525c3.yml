http:
  routers:
    mailer6-http:
      rule: "Host(`mailer6.example.com`)"
      entryPoints: [web]
      middlewares: ["http-to-https@file"]
      service: noop@internal
    mailer6:
      rule: "Host(`mailer6.example.com`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: mailer6
  services:
    mailer6:
      loadBalancer:
        servers:
          - url: "http://mailer6-web:80"

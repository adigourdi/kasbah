services:
  demo-web:
    image: nginx:alpine
    container_name: demo-web
    networks: [kasbah-net]
    restart: unless-stopped
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: "512m
      # this is a continuation, not a comment"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kasbah-net:
    external: true

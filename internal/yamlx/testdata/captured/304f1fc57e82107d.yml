schema: 1
kasbah_version: 0.1.0-dev

name: demo
domain: "demo.example.com"

sync:
  - compose.prod.yml -> compose.yml
  - .env.prod.example

hooks:
  pre-deploy:
    - demo-api echo before
  post-deploy:
    - demo-api echo after
  pre-rollback:
    - demo-api echo rollback-before
  post-rollback:
    - demo-api echo rollback-after

backup:
  container: demo-db
  check: "true"
  command: "pg_dump -U u d"
  extension: sql.gz

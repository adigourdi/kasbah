# file header comment
services:

  # above the service
  demo-web:
    # inside, above image
    image: nginx:alpine
    container_name: demo-web

    # inside, near the end
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    networks: [kasbah-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# below everything
networks:
  kasbah-net:
    external: true

services:
  mailer2-web:
    image: nginx:alpine
    container_name: mailer2-web
    restart: unless-stopped
    cpus: ${KASBAH_CPU_LIMIT}
    mem_limit: ${KASBAH_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kasbah-net, internal]

networks:
  kasbah-net:
    external: true
  internal: {}

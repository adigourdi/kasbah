http:
  routers:
    mailer3-http:
      rule: "Host(`mailer3.example.com`)"
      entryPoints: [web]
      middlewares: ["http-to-https@file"]
      service: noop@internal
    mailer3:
      rule: "Host(`mailer3.example.com`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: mailer3
  services:
    mailer3:
      loadBalancer:
        servers:
          - url: "http://mailer3-web:80"
